[package]
name         = "desys"
edition      = "2024"

[dependencies]
#
# Mandatory dependencies.
#
serde_json5 = { version = ">=0.2.1,   <1.0.0", optional = false, default-features = false, features = [ ] }
serde_json  = { version = ">=1.0.149, <2.0.0", optional = false, default-features = false, features = [ "std", "preserve_order" ] }
serde       = { version = ">=1.0.228, <2.0.0", optional = false, default-features = false, features = [ ] }

#
# Conditional dependencies for optional features.
#
toml        = { version = ">=1.0.6,   <2.0.0", optional = true,  default-features = false, features = [ "parse", "serde" ] }
tokio       = { version = ">=1.50.0,  <2.0.0", optional = true,  default-features = false, features = [ ] }

[dev-dependencies]
#
# Dependencies for examples.
#
serde       = { version = "=1.0.228", default-features = false, features = [ "derive" ] }
tokio       = { version = "=1.50.0",  default-features = false, features = [ "rt" ] }

[features]
tokio = ["dep:tokio"]
